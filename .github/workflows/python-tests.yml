name: Python unit tests

# Runs the unit tests in tests/python, configured in pyproject.toml: ESPHome validates configurations and
# generates their code in the test process. Every line and branch of the component must run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned versions of the tools, updated by Dependabot
  REQUIREMENTS: .github/requirements-ci.txt

jobs:
  # The check runs only if the files it covers changed, see .github/actions/changed-files
  changes:
    name: Find the changed files
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        uses: ./.github/actions/changed-files
        with:
          files: '\.py$|^pyproject\.toml$'

  test:
    name: Run the Python tests
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install ESPHome and pytest
        run: pip install -c "${REQUIREMENTS}" esphome pytest pytest-cov

      - name: Run the tests
        run: pytest --cov-fail-under=100
