name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned versions of the tools, updated by Dependabot
  REQUIREMENTS: .github/requirements-ci.txt
  EXAMPLE: kyo-alarm-example.yaml

jobs:
  # Each check runs only if the files it covers changed. A skipped job counts as passed for required checks, unlike a
  # workflow filtered out with `paths`
  changes:
    name: Find the changed files
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      python: ${{ steps.filter.outputs.python }}
      example: ${{ steps.filter.outputs.example }}
      tests: ${{ steps.filter.outputs.tests }}
      cpp-tests: ${{ steps.filter.outputs.cpp-tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match the changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Everything runs when started by hand, when the base is unknown, or when the CI itself changed
          all=false
          if [[ "${EVENT}" == workflow_dispatch || ! "${BASE}" =~ [1-9a-f] ]]; then
            all=true
          else
            changed=$(git diff --name-only "${BASE}" HEAD)
            echo "Changed files:" && echo "${changed}"
            grep -qE '^\.github/(workflows/ci\.yml|requirements-ci\.txt)$' <<< "${changed}" && all=true
          fi
          match() {
            [[ "${all}" == true ]] || grep -qE "$1" <<< "${changed}" && echo true || echo false
          }
          {
            echo "cpp=$(match '\.(cpp|h)$|^\.clang-format$')"
            echo "python=$(match '\.py$|^pyproject\.toml$')"
            echo "example=$(match '^components/|^kyo-alarm-example\.yaml$')"
            echo "tests=$(match '^components/|^tests/[^/]+\.yaml$|^tests/platforms/')"
            echo "cpp-tests=$(match '^components/|^tests/cpp/')"
          } | tee -a "${GITHUB_OUTPUT}"

  format:
    name: Check the C++ formatting
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install clang-format
        run: pip install -c "${REQUIREMENTS}" clang-format

      - name: Check the formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

  ruff:
    name: Check the Python code
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install -c "${REQUIREMENTS}" ruff

      # Configured in pyproject.toml
      - name: Check the formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

  example:
    name: Validate and compile the example
    needs: changes
    if: needs.changes.outputs.example == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      # No cache for the toolchains: ESPHome keeps them in ~/.cache/esphome, not in ~/.platformio, whose cache was a few
      # KiB. The whole job, downloads included, takes about a minute
      - name: Install ESPHome
        run: pip install -c "${REQUIREMENTS}" esphome

      # The real secrets.yaml is not in the repository
      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: ci
          wifi_password: ci-password
          api_encryption_key: "$(openssl rand -base64 32)"
          EOF

      - name: Validate the configuration
        run: esphome config "${EXAMPLE}"

      - name: Compile the firmware
        run: esphome compile "${EXAMPLE}"

  # Built for the host by ESPHome and run with GoogleTest, with AddressSanitizer and UndefinedBehaviorSanitizer. Every
  # line of the component must run (the branches the sanitizers add cannot all be taken)
  cpp-tests:
    name: Run the C++ tests
    needs: changes
    if: needs.changes.outputs.cpp-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install ESPHome and gcovr
        run: pip install -c "${REQUIREMENTS}" esphome gcovr

      - name: Run the tests
        run: tests/cpp/run.sh --fail-under-line 100

  # ESPHome validates configurations and generates their code in the test process. Every line and branch of the
  # component must run
  python-tests:
    name: Run the Python tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install ESPHome and pytest
        run: pip install -c "${REQUIREMENTS}" esphome pytest pytest-cov

      # Configured in pyproject.toml
      - name: Run the tests
        run: pytest --cov-fail-under=100

  # Every combination of the optional parts of the component on ESP8266, the full configuration on the other platforms.
  # The toolchains are downloaded at each run: ESPHome keeps them in ~/.cache/esphome, several GB for ESP32
  tests:
    name: Compile the tests on ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: esp8266
            configs: minimal event-log text-sensors full
          - platform: esp32-idf
            configs: full
          - platform: esp32-arduino
            configs: full
          - platform: esp32-c3-idf
            configs: full
          - platform: rp2040
            configs: full
          - platform: bk72xx
            configs: full
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install ESPHome
        run: pip install -c "${REQUIREMENTS}" esphome

      - name: Compile the tests
        env:
          PLATFORM: ${{ matrix.platform }}
          CONFIGS: ${{ matrix.configs }}
        run: |
          for config in ${CONFIGS}; do
            echo "::group::${config}"
            esphome -s platform "${PLATFORM}" compile "tests/${config}.yaml"
            echo "::endgroup::"
          done

  # A single check for the branch ruleset, whatever the platforms in the matrix
  tests-result:
    name: Compile the tests
    needs: [changes, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "Find the changed files: ${CHANGES}, compile the tests: ${TESTS}"
          [[ "${CHANGES}" == success && "${TESTS}" =~ ^(success|skipped)$ ]]
