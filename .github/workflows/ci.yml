name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned versions of the tools, updated by Dependabot
  REQUIREMENTS: .github/requirements-ci.txt
  EXAMPLE: kyo-alarm-example.yaml

jobs:
  # Each check runs only if the files it covers changed. A skipped job counts as passed for required checks, unlike a
  # workflow filtered out with `paths`
  changes:
    name: Find the changed files
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      python: ${{ steps.filter.outputs.python }}
      example: ${{ steps.filter.outputs.example }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match the changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Everything runs when started by hand, when the base is unknown, or when the CI itself changed
          all=false
          if [[ "${EVENT}" == workflow_dispatch || ! "${BASE}" =~ [1-9a-f] ]]; then
            all=true
          else
            changed=$(git diff --name-only "${BASE}" HEAD)
            echo "Changed files:" && echo "${changed}"
            grep -qE '^\.github/(workflows/ci\.yml|requirements-ci\.txt)$' <<< "${changed}" && all=true
          fi
          match() {
            [[ "${all}" == true ]] || grep -qE "$1" <<< "${changed}" && echo true || echo false
          }
          {
            echo "cpp=$(match '\.(cpp|h)$|^\.clang-format$')"
            echo "python=$(match '\.py$|^pyproject\.toml$')"
            echo "example=$(match '^components/|^kyo-alarm-example\.yaml$')"
          } | tee -a "${GITHUB_OUTPUT}"

  format:
    name: Check the C++ formatting
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install clang-format
        run: pip install -c "${REQUIREMENTS}" clang-format

      - name: Check the formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

  ruff:
    name: Check the Python code
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install -c "${REQUIREMENTS}" ruff

      # Configured in pyproject.toml
      - name: Check the formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

  example:
    name: Validate and compile the example
    needs: changes
    if: needs.changes.outputs.example == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install ESPHome
        id: esphome
        run: |
          pip install -c "${REQUIREMENTS}" esphome
          echo "version=$(python -c 'import esphome.const; print(esphome.const.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-esphome-${{ steps.esphome.outputs.version }}

      # The real secrets.yaml is not in the repository
      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: ci
          wifi_password: ci-password
          api_encryption_key: "$(openssl rand -base64 32)"
          EOF

      - name: Validate the configuration
        run: esphome config "${EXAMPLE}"

      - name: Compile the firmware
        run: esphome compile "${EXAMPLE}"
