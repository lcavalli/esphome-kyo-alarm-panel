name: CI with the next ESPHome

# Compiles the example and part of the tests, and runs the unit tests, with the beta and dev releases of ESPHome, to
# find incompatibilities before they reach a stable release. Not a required check: a failure only marks the run as
# failed
on:
  schedule:
    - cron: "23 4 * * *"
  # Changes to this workflow and to the tests are tested in their pull request
  pull_request:
    branches: [main]
    paths: [.github/workflows/ci-beta.yml, tests/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXAMPLE: kyo-alarm-example.yaml

jobs:
  example:
    name: Validate and compile the example with ESPHome ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      # A broken dev release must not stop the beta build
      fail-fast: false
      matrix:
        channel: [beta, dev]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # No cache for the toolchains, see ci.yml
      - name: Install ESPHome
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          if [[ "${CHANNEL}" == dev ]]; then
            # The head of the dev branch
            pip install https://github.com/esphome/esphome/archive/refs/heads/dev.tar.gz
          else
            # The latest release, beta or stable. Only ESPHome may be a pre-release: pinning its version allows it,
            # while --pre would allow pre-releases of the dependencies too
            pip install --pre --no-deps esphome
            pip install "esphome==$(pip show esphome | sed -n 's/^Version: //p')"
          fi
          # The version under test, in the log
          esphome version

      # The real secrets.yaml is not in the repository
      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: ci
          wifi_password: ci-password
          api_encryption_key: "$(openssl rand -base64 32)"
          EOF

      - name: Validate the configuration
        run: esphome config "${EXAMPLE}"

      - name: Compile the firmware
        run: esphome compile "${EXAMPLE}"

      # Not checked: the coverage of the tests
      - name: Run the C++ tests
        run: |
          pip install -c .github/requirements-ci.txt gcovr
          tests/cpp/run.sh

      - name: Run the Python tests
        run: |
          pip install -c .github/requirements-ci.txt pytest pytest-cov
          pytest

      # The combinations of the optional parts the example does not cover, and ESP32 with ESP-IDF (see ci.yml)
      - name: Compile the tests
        run: |
          for test in esp8266:minimal esp8266:event-log esp8266:text-sensors esp32-idf:full; do
            echo "::group::${test}"
            esphome -s platform "${test%%:*}" compile "tests/${test#*:}.yaml"
            echo "::endgroup::"
          done
