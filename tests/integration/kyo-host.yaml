# Firmware of the integration tests: the component runs on the host, its UART is a TCP connection to the simulated
# panel of panel.py (tcp_uart client), its entities are read and controlled through the native API as Home Assistant
# does. Its passthrough port is a TCP server (uart_tcp), for the tests in the role of the programming software. The
# tests compile it with free ports, see conftest.py
substitutions:
  api_port: "6053"
  panel_port: "7000"
  passthrough_port: "7001"

esphome:
  name: kyo-integration

host:

logger:
  # The bytes forwarded by the passthrough
  level: VERBOSE

api:
  port: ${api_port}

external_components:
  - source: ../../components

tcp_uart:
  - id: panel_link
    host: 127.0.0.1
    port: ${panel_port}
    # The tests start and stop the panel
    reconnect_interval: 200ms
    baud_rate: 9600
    parity: EVEN

kyo_alarm:
  id: kyo
  uart_id: panel_link
  passthrough:
    id: kyo_passthrough
    idle_timeout: 1min

uart_tcp:
  - role: server
    uart_id: kyo_passthrough
    port: ${passthrough_port}

alarm_control_panel:
  - platform: kyo_alarm
    name: Alarm
    partitions:
      away: [1, 2]
      home: [1]
    requires_code: true
    requires_code_to_arm: true

binary_sensor:
  - platform: kyo_alarm
    communication:
      name: Communication
    zones:
      - zone: 1
        sensor:
          name: Zone 1

switch:
  - platform: kyo_alarm
    passthrough:
      name: Passthrough
    zones:
      - zone: 1
        bypass:
          name: Zone 1 bypass
