# ESP32-C3 (RISC-V) with ESP-IDF
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0

uart:
  - id: uart_1
    tx_pin: GPIO21
    rx_pin: GPIO20
    baud_rate: 9600
    parity: EVEN
  - id: uart_2
    tx_pin: GPIO4
    rx_pin: GPIO5
    baud_rate: 9600
    parity: EVEN
