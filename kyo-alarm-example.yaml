esphome:
  name: kyo-alarm-example

esp8266:
  board: d1_mini

# Disable logging on the serial port
logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Diagnostics: read the panel memory, e.g. request "F0 00 00 0B 00"
    - action: read_raw
      variables:
        request: string
      then:
        - kyo_alarm.read_raw:
            id: kyo
            request: !lambda return request;
        - api.respond:
            success: !lambda return id(kyo).get_raw_error().empty();
            error_message: !lambda return id(kyo).get_raw_error();
            data: !lambda root["reply"] = id(kyo).get_raw_reply();

ota:
  - platform: esphome
    # Encrypted with the api encryption key. To update a device still flashed with a password
    # protected OTA, do the first install with its `password` and `allow_plaintext_upload: true`
    # under `encryption`, then remove both.
    encryption:

time:
  - platform: homeassistant
    id: ha_time

uart:
  tx_pin: GPIO5
  rx_pin: GPIO4
  baud_rate: 9600
  data_bits: 8
  parity: EVEN

external_components:
  - source: components

kyo_alarm:
  id: kyo
  model: KYO32G
  # Keep the panel clock in sync
  time_id: ha_time

alarm_control_panel:
  - platform: kyo_alarm
    name: "Alarm"
    # Partitions armed by each mode, as a list or a bitmask (bit 0 is partition 1), with the partition status shown
    # by the keypad (I armed, D disarmed). Away arms total, home partial, night partial with no delay
    partitions:
      away: [1, 2, 3, 4]  # IIII, Enter on the keypad
      home: [1, 4]        # IDDI, keypad mode A
      night: 0x0d         # IDII, keypad mode B
    # Codes are checked against the user PINs stored in the panel
    requires_code: true
    requires_code_to_arm: true

binary_sensor:
  - platform: kyo_alarm
    # Diagnostics
    communication:
      name: "Communication"
    mains_failure:
      name: "Mains failure"
    low_battery:
      name: "Low battery"
    phone_line_fault:
      name: "Phone line"
    tamper_zone:
      name: "Zone tamper"
    tamper_system:
      name: "System tamper"
    zones:
      - zone: 1
        sensor:
          name: "Front door"
          device_class: door
        alarm_memory:
          name: "Front door alarm memory"
        tamper:
          name: "Front door tamper"
      - zone: 2
        sensor:
          name: "Dining room"
          device_class: motion
        alarm_memory:
          name: "Dining room alarm memory"

switch:
  - platform: kyo_alarm
    zones:
      - zone: 1
        bypass:
          name: "Front door bypass"
      - zone: 2
        bypass:
          name: "Dining room excluded"

button:
  - platform: kyo_alarm
    reset_memory:
      name: "Reset alarm memory"
    sync_clock:
      name: "Sync panel clock"

text_sensor:
  - platform: kyo_alarm
    panel_model:
      name: "Panel model"
    firmware_version:
      name: "Firmware version"
